[project]
name = "trendradar-workbench"
version = "1.0.0"
description = "A production-oriented personal news intelligence workbench"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "Django>=5.2.8,<5.3", "psycopg[binary,pool]>=3.2,<4",
  "httpx>=0.28,<1", "feedparser>=6,<7", "openai>=2,<3",
  "pydantic>=2,<3", "uvicorn>=0.35,<1", "whitenoise>=6,<7",
  "PyYAML>=6,<7", "jieba>=0.42,<1", "defusedxml>=0.7,<1",
]
[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4", "ruff>=0.12", "playwright>=1.50"]
[project.scripts]
radar = "app.core.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "app.core.settings"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
target-version = "py314"
[tool.ruff.lint]
extend-ignore = ["BLE001", "RUF012", "SIM117"]
