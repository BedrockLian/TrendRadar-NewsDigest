{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><div class="eyebrow">NEWS ARCHIVE</div><h1>新闻归档</h1><p class="muted">每篇报道，只收录一次。每次进展，都有来处。</p></div></div>
<form class="filters" method="get"><label>搜索<input name="q" value="{{ request.GET.q }}" placeholder="至少两个字符"></label><label>来源<select name="feed"><option value="">全部来源</option>{% for feed in feeds %}<option value="{{ feed.pk }}" {% if request.GET.feed == feed.pk|stringformat:'s' %}selected{% endif %}>{{ feed.name }}</option>{% endfor %}</select></label><label>分类<select name="category"><option value="">全部分类</option>{% for c in categories %}<option value="{{ c.pk }}" {% if request.GET.category == c.pk|stringformat:'s' %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></label><label>开始日期<input type="date" name="start" value="{{ request.GET.start }}"></label><label>截止日期<input type="date" name="end" value="{{ request.GET.end }}"></label><button>筛选</button><a class="muted" href="/news/">重置</a></form>
{% if error %}<p class="notice error">{{ error }}</p>{% endif %}{% include 'rows.html' %}{% if next_url %}<a class="button quiet next" href="{{ next_url }}">下一页 →</a>{% endif %}{% endblock %}
